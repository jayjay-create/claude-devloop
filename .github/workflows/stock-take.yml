# The half of the merge gate that lives in this repository: on every pull
# request into main, run scripts/devloop-stock-take and its self-test against
# the merged state, and fail the check when either fails. The other half, the
# check being required on main, is a setting of the repository and not a file
# in it: docs/roadmap-archive-1.md, the entry of 29 September 2026 on the merge gate,
# carries the command that sets it and the merge sequence that follows.
#
# The check appears under the job's name, stock-take. It installs nothing:
# the tool needs python3 (3.8 or later, for ast.Constant and
# subprocess.run(capture_output=True)) and git (2.15 or later, for rev-parse
# --is-shallow-repository), and the runner image carries both. It writes
# nothing back: contents are read-only and the token is not persisted.
#
# Since the fourth addendum of 14 October 2026 to the roadmap entry on the
# command reader a second job, hooks on every system, runs on ubuntu-latest,
# macos-latest and windows-latest - there under the bash of Git for Windows,
# which "shell: bash" selects - and, since the fifth addendum of that day,
# under Alpine 3.22 with busybox awk in a container on ubuntu-latest, the
# reader's self-test and every handler of hooks/hooks.json once with a
# harmless input of its event in a throwaway project, and is red where the
# self-test or a handler answers otherwise than 0 - since 21 November 2026
# also each of the four hooks that hand a command over, with an input on the
# path on which it hands over, twice, without CLAUDE_CODE_ENTRYPOINT and with
# it on cli, red where one of the eight ends otherwise than with 2 and the
# place its system has, and since 22 November 2026 bin/devloop-text
# skill-name twice the same way, red where it ends otherwise than with 0,
# leaves ${DEVLOOP_SURFACE} standing or does not carry the line
# bin/devloop-surface prints for its system and its situation -: devloop runs on every
# system, the person's decision of 14 October 2026, and until then nothing
# showed that the reader ran under Linux at all, where it did not. Its four checks
# carry the job's name with the system in brackets; making them required on
# main is the owner's setting, as for stock-take, and the fifth addendum
# carries the command. .gitattributes keeps every text file at LF on every
# system, Git for Windows' default core.autocrlf=true notwithstanding. Since
# the addendum of 17 October 2026 to the roadmap entry of that day on arming
# past the gate the job runs the self-test of bin/devloop-arm beside the
# reader's, and is red where it is; since 23 October 2026 every self-test
# under bin/, and since 31 October 2026 the self-test of
# scripts/devloop-run-workflow on three of its four systems, the job's
# comment saying which and why. Since 22 October 2026 the job stock-take
# reads the title of the pull request and the head of every entry the branch
# adds to docs/roadmap.md against the rule on titles, the last step of the
# job, and the event fires with the type edited as well, so that a title
# changed on an open pull request is read before it can be merged; the three
# default types stand beside it, since naming one type names them all. Since
# 17 November 2026 the job hooks on every system ends on a step that reads
# every place of the hooks, the programs and the loaded texts that takes a
# file of the project apart with the file at LF, with CRLF from a checkout
# under core.autocrlf=true and with CRLF committed as it stands, and reaches
# the three calls of awk the step before it does not reach, order (2) of
# milestone 12; the line .gitattributes keeps devloop's own files at LF by,
# above, says nothing of a project's files, which carry no such line.
# Since 18 November 2026 the job stock-take holds every line of the hooks,
# the programs and the loaded texts that reads a file of the project to a
# case of that last step or to the places it names as none, the roadmap
# entry of that date on the check for a place without a case.
# Since 23 November 2026 the job stock-take runs the checks under "Before a
# handover, run these" in docs/skill-conventions.md, every one but the run
# of this file's steps, with scripts/devloop-handover-checks, and that
# program's self-test, and the job hooks on every system runs the self-test
# under macos-latest, each place saying in its comment what it holds;
# decided on that day, docs/plan.md under milestone 15.
# Since 27 November 2026 the job hooks on every system has thirty minutes
# where it had fifteen, and scripts/devloop-run-workflow, where it runs this
# file on a machine, runs that job's step of the self-tests and the hooks a
# second time behind a stand-in for uname that answers as Git Bash, the
# job's comment saying what that run is and what it does not reach; decided
# on that day, docs/plan.md under milestone 12.
name: merge gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: stock-take-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stock-take:
    name: stock-take
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The tool blames every line of every thing, finds the commit that
          # introduced a version with git log -S over the history, holds a
          # run's commit against origin/main, and refuses a shallow clone. A
          # default checkout is one commit deep with no origin/main; depth 0
          # fetches all history for all branches. The ref stays the event's
          # default, refs/pull/N/merge: the branch merged onto main as main
          # stood when the run started, not the branch tip.
          fetch-depth: 0
          persist-credentials: false

      - name: what the checkout holds
        run: |
          git --version
          python3 --version
          echo "HEAD $(git rev-parse HEAD) with parents $(git rev-parse 'HEAD^@' | tr '\n' ' ')"
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "shallow checkout: the tool refuses it"; exit 1; }
          git rev-parse -q --verify origin/main >/dev/null || { echo "no origin/main: the tool cannot hold runs against it"; exit 1; }
          echo "origin/main $(git rev-parse origin/main)"

      - name: stock-take
        run: scripts/devloop-stock-take

      - name: self-test
        run: scripts/devloop-stock-take --self-test

      # Since 12 October 2026: every hook reads its input through
      # bin/devloop-command-reader and through nothing else, the one line
      # below standing once in each, hooks/stop-checks.sh excepted, which
      # discards its input with cat >/dev/null and reads nothing of it; every
      # handler under PreToolUse and the one under PermissionRequest in
      # hooks/hooks.json carries "onFailure": "block"; since 13 October 2026
      # no handler under PreToolUse carries an if field, since the vendor
      # calls that filter best-effort and the three guards it narrowed hold
      # hard prohibitions; and the reader's self-test is green.
      # docs/skill-conventions.md, "A hook reads its input through one
      # program". This step is no check of "Before a handover, run these"; it
      # runs here, on every pull request, and installs nothing.
      - name: hooks read through the reader, handlers block on failure and carry no if field, the reader's self-test
        run: |
          bin/devloop-command-reader --self-test
          LINE='INPUT=$("$HERE/../bin/devloop-command-reader") || exit 1'
          HERE='HERE=$(cd "$(dirname "$0")" && pwd)'
          red=0
          for f in hooks/*.sh; do
            if [ "$f" = hooks/stop-checks.sh ]; then
              [ "$(grep -cFx 'cat >/dev/null' "$f")" -eq 1 ] && ! grep -qF 'devloop-command-reader' "$f" || { echo "$f: reads its input, and it is the one hook that discards it"; red=1; }
            else
              [ "$(grep -cFx "$LINE" "$f")" -eq 1 ] && [ "$(grep -cFx "$HERE" "$f")" -eq 1 ] || { echo "$f: does not read its input through the one line"; red=1; }
            fi
            grep -nE '\$\(cat\)|<&0|/dev/stdin|cat \| |^cat$' "$f" && { echo "$f: reads its input another way"; red=1; }
          done
          python3 - <<'PY' || red=1
          import json, sys
          h = json.load(open("hooks/hooks.json"))["hooks"]
          bad = [x["command"] for ev in ("PreToolUse", "PermissionRequest") for g in h[ev] for x in g["hooks"] if x.get("onFailure") != "block"]
          if bad:
              print("handlers without onFailure block:", bad); sys.exit(1)
          filtered = [x["command"] for g in h["PreToolUse"] for x in g["hooks"] if "if" in x]
          if filtered:
              print("handlers under PreToolUse with an if field:", filtered); sys.exit(1)
          PY
          exit $red

      # Since 20 October 2026: README.md says the state of today and carries no
      # date, the history standing in the commits and in docs/roadmap.md, the
      # person's decision of that day, the roadmap entry of that date on
      # milestone 3, part 2; docs/skill-conventions.md, "README.md carries no
      # date". Red where the file carries a date in a form like 20 October
      # 2026, October 2026 or 2026-10-20, one broken over a line break
      # included: the file is read as one line, every line break and carriage
      # return a space, and every date found is printed. Before that day the
      # README carried eight such dates, one of them over a line break. This
      # step is no check of "Before a handover, run these" either. The red
      # line says since 21 October 2026 that the file must carry no date and
      # that it carries what follows.
      - name: README.md carries no date
        run: |
          DATES=$(tr '\r\n' '  ' < README.md | grep -o -E '([0-9]{1,2} +)?(January|February|March|April|May|June|July|August|September|October|November|December) +[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2}') || { echo "README.md carries no date"; exit 0; }
          echo "README.md must carry no date, and it carries:"; printf '%s\n' "$DATES"; exit 1

      # Since 21 October 2026: README.md names no file or document of devloop's
      # own, the second half of the rule under "README.md carries no date" in
      # docs/skill-conventions.md, the person's decision of that day, the
      # roadmap entry of that date on milestone 3, part 3. Red where the file
      # names one of devloop's documents - docs/plan.md, docs/roadmap.md,
      # docs/skill-conventions.md, docs/stock-take.tsv, since 1 November
      # 2026 docs/rationale.md, since 2 November 2026 docs/defects.md and
      # since 4 November 2026 the archives of the roadmap,
      # docs/roadmap-archive-<n>.md - or
      # a path into bin/, scripts/, shared/,
      # hooks/, skills/, .github/ or .claude-plugin/, the file read as one line
      # as above and every find printed. What the README says of the user's
      # project - docs/agents/, ~/.claude/settings.json, .claude/ - is no find,
      # none of those being in the list. This step is no check of "Before a
      # handover, run these" either.
      - name: README.md names no file or document of devloop's own
        run: |
          NAMES=$(tr '\r\n' '  ' < README.md | grep -o -E 'docs/(plan\.md|roadmap\.md|roadmap-archive-[0-9]+\.md|skill-conventions\.md|stock-take\.tsv|rationale\.md|defects\.md)|(^|[^A-Za-z0-9_./~-])(bin|scripts|shared|hooks|skills|\.github|\.claude-plugin)/[A-Za-z0-9_./-]*') || { echo "README.md names no file or document of devloop's own"; exit 0; }
          echo "README.md must name no file or document of devloop's own, and it names:"; printf '%s\n' "$NAMES" | sed 's/^[^A-Za-z0-9_.]//'; exit 1

      # Since 1 November 2026: the texts devloop loads into a session - every
      # file under skills/, shared/ and output-styles/ - carry the rule and at
      # most a short reason that says what it prevents, and no date and no
      # history: the reason and the case of a rule, and the wordings approved
      # for what a user sees, stand in docs/rationale.md, the history in the
      # commits and in docs/roadmap.md; decided on 1 November 2026, the
      # roadmap entry of that date on the history in the loaded texts, and
      # docs/skill-conventions.md under "The texts devloop loads carry no date
      # and no history". Red where one of those files carries a date in a form
      # the step README.md carries no date reads - like 20 October 2026,
      # October 2026 or 2026-10-20 - one broken over a line break included:
      # each file is read whole, every line break and carriage return a space
      # as there, and every find is printed with the file and the line it
      # starts on. History written without a date - "until then", an entry
      # named by its subject - this step does not see. This step is no check
      # of "Before a handover, run these" either.
      - name: skills/, shared/ and output-styles/ carry no date
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          DATE = re.compile(r"([0-9]{1,2} +)?(January|February|March|April|May|June|July|August|September|October|November|December) +[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2}")
          finds = []
          for path in sorted(p for d in ("skills", "shared", "output-styles") for p in pathlib.Path(d).rglob("*") if p.is_file()):
              text = path.read_text(encoding="utf-8")
              flat = text.replace("\r", " ").replace("\n", " ")
              finds += ["%s:%d: %s" % (path.as_posix(), text.count("\n", 0, m.start()) + 1, " ".join(m.group(0).split())) for m in DATE.finditer(flat)]
          if not finds: print("skills/, shared/ and output-styles/ carry no date"); sys.exit(0)
          print("skills/, shared/ and output-styles/ must carry no date, and they carry:"); print("\n".join(finds)); sys.exit(1)
          PY

      # Since 18 November 2026: every line under hooks/, bin/, skills/ and
      # shared/ that reads a file of the project carries an anchor in the last
      # step of the job hooks on every system - a line "# reads: `FILE`
      # "TEXT"" over the call of hold of the case that reads it, or a line
      # "# not a place (the reason): `FILE` "TEXT"" at the head of that step -,
      # decided on 18 November 2026, the roadmap entry of that date on the
      # check for a place without a case. A line reads a file of the project
      # where it reads a blob of git, or where a command of the search of 17
      # November 2026 at the place of a command and fed by no pipe, a
      # redirection from a path or an open() for reading in Python reads a
      # path of the project: one a project carries, written on the line and
      # not under the home directory, or a variable of the same file set from
      # such a path, from a blob, from the project's root or from such a
      # variable. Comments, docstrings, heredocs no interpreter reads, the
      # lines of a multi-line awk program and the function of a self-test are
      # not read, nor in skills/ and shared/ anything but the code spans and
      # the indented and fenced lines. TEXT is 20 to 80 characters of the line
      # found once in its file, of the nearest line above it where the line's
      # text stands in another line of the file too, as the head of
      # scripts/devloop-stock-take anchors a line that can carry no unique
      # anchor. Red where such a line has no anchor, where an anchor stands
      # over no hold of its file, is not found once, names a line that reads
      # nothing by this step, or names a line as a case and as a not place at
      # once, and where the step on line endings is not found once; every find
      # printed, a line with its file, its number and its text, and what makes
      # the pull request green. That entry measured the form over the 77
      # commits of the first parent from 919c9de to b77e3bc: red at the four
      # places that came in after the search of 15 October 2026 and at no
      # other line, and the fourteen of that search named at 919c9de. This
      # step is no check of "Before a handover, run these" either.
      - name: every line that reads a file of the project has its case in the step on line endings, or stands among the not places there
        run: |
          python3 - <<'PY'
          import os, re, sys
          WF = ".github/workflows/stock-take.yml"
          STEP = "      - name: every place that reads a file of the project"
          # a reading: a blob of git; a command of the search of 17 November 2026 at the place of a command, fed by no pipe and no here-string; a redirection from a path; in Python an open() for reading
          BLOB = re.compile(r"\bgit\b(\s+-[Cc]\s+\S+)*\s+(show\b[^|;&]*:|cat-file\s+(?!-e)|log\b[^|;&]*\s(-p|-S|-G|--patch)|grep\b|blame\b)|[\"']git[\"'],\s*[\"'](show|cat-file|log|grep)[\"']")
          WORDS = r"(grep|egrep|fgrep|sed|awk|cat|head|tail|cut|tr|wc|read)"
          CMD = re.compile(r"(?:^|[;&|({!`]|\$\(|<\(|\bthen\b|\bdo\b|\belse\b|\bif\b|\belif\b|\bwhile\b|\buntil\b)\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*" + WORDS + r"\b(?![|)])")
          REDIR = re.compile(r"(?<![<0-9&=])<(?![<(&=])\s*(?!\"?/dev/)(\"?\$|\"?/|\"?\./|\"?~|[\w.-]*/)[^\s;|&)]*")
          # a path of the project: one a project of the person carries and not under the home directory; or a variable of the same file set from such a path, from a blob, from the project's root or from such a variable
          PATH = re.compile(r"(?<![\w.-])(\./)?(docs/agents/[\w./-]*|node_modules/[\w./@-]*|\.cargo/config(\.toml)?|\.claude/[\w.-]+\.local|\.git/devloop[\w.-]*|package\.json|pyproject\.toml|Makefile|CLAUDE\.md|\.gitignore|Cargo\.toml|go\.mod|requirements\.txt)")
          HOME = re.compile(r"(~|\$HOME|\$\{HOME\}|HOME|\$CARGO_HOME|\$\{CARGO_HOME[^}]*\})/$")
          ROOT = re.compile(r"--show-toplevel|--git-dir|--git-common-dir|\bCLAUDE_PROJECT_DIR\b|\bPROJECT_DIR\b")
          SET = (re.compile(r"(?:^|[;&|({\s])(?:local\s+|export\s+|readonly\s+)?([A-Za-z_]\w*)\s*=(?!=)(.*)"), re.compile(r"\bfor\s+([A-Za-z_]\w*)\s+in\s+([^;]*)"))
          SELFTEST_SH = re.compile(r"(function\s+)?(self_?test|selftest)\w*\s*\(\)")
          SELFTEST_PY = re.compile(r"def (self_?test|selftest)\w*\(")

          def project(t):
              return any(not HOME.search(t[:m.start()]) for m in PATH.finditer(t))

          def kind_of(path, lines):
              first = (lines or [""])[0]
              return next(k for k, hit in (("text", path.endswith(".md")), ("skip", path.endswith(".json")), ("py", "python" in first), ("sh", path.endswith(".sh") or "sh" in first), ("skip", True)) if hit)

          def text_code(lines):
              # in a text: the code spans, and the indented or fenced lines whole
              out, fence = [], False
              for i, l in enumerate(lines, 1):
                  mark = l.strip().startswith("```")
                  fence = fence != mark
                  spans = re.findall(r"`([^`]+)`", l)
                  out += [] if mark else [(i, l)] if fence or l.startswith("    ") else [(i, " ;; ".join(spans))] if spans else []
              return out

          def py_code(lines):
              # in Python: no comment, no docstring, nothing of the self-test, which never runs in a project
              out, st, doc = [], False, None
              for i, l in enumerate(lines, 1):
                  s = l.strip()
                  st = st and not (l and not l[0].isspace() and not l.startswith("#"))
                  skip = bool(doc) or st or bool(SELFTEST_PY.match(l))
                  st = st or bool(SELFTEST_PY.match(l)) and not doc
                  q = re.match(r"[rRbBuU]?(\"\"\"|''')", s)
                  out += [] if skip or q or not s or s.startswith("#") else [(i, l)]
                  doc = (None if doc in l else doc) if doc else (q.group(1) if q and not skip and s.count(q.group(1)) == 1 else None)
              return out

          def sh_code(lines):
              # in a shell program: no comment, no heredoc no interpreter reads, no line of a multi-line awk program, nothing of the self-test
              out, hd, hd_code, st, aw = [], None, False, False, False
              for i, l in enumerate(lines, 1):
                  s = l.strip()
                  inside = hd is not None
                  out += [(i, l)] if inside and hd_code and s != hd and not s.startswith("#") else []
                  hd = (None if s == hd else hd) if inside else hd
                  skip = inside or st or aw or bool(SELFTEST_SH.match(l))
                  st, aw = ((st or not aw) and l != "}", aw and l.count("'") % 2 == 0) if skip and not inside else (st, aw)
                  m = None if skip or s.startswith("#") or not s else re.search(r"<<-?\s*['\"]?([A-Za-z_][A-Za-z0-9_]*)['\"]?", l)
                  opens = m and "<<<" not in l[max(0, m.start() - 1):m.start() + 3]
                  hd, hd_code = (m.group(1), bool(re.search(r"python|\$PY\b|\"\$PY\"|awk|\bbash\b|\bsh\b", l[:m.start()]))) if opens else (hd, hd_code)
                  aw = aw or not skip and bool(re.search(r"\bawk\b", l)) and l.count("'") % 2 == 1
                  out += [] if skip or s.startswith("#") or not s else [(i, l)]
              return out

          def reads(kind, t):
              py = kind == "py" and bool(re.search(r"\bopen\(", t) and not re.search(r"\bopen\(.*,\s*[\"'][wax]", t) or re.search(r"\.read_text\(|\.read_bytes\(", t))
              for m in (CMD.finditer(t) if kind != "py" else ()):
                  pre = re.sub(r"(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*$", "", t[:m.start(1)]).rstrip()
                  rest = t[m.end(1):]
                  seg = re.split(r"\|\||&&|[|;]", rest, maxsplit=1)[0]
                  fed = pre.endswith("|") and not pre.endswith("||") or "<<<" in seg or re.search(r"<<-?\s*['\"]?\w", rest)
                  bare = {"cat": re.match(r"\s*($|[)|;&`>])", rest), "read": not REDIR.search(seg) and not re.search(r"\bdone\s*<(?!<)", t), "tr": not REDIR.search(seg)}.get(m.group(1))
                  py = py or not fed and not bare
              return py or kind != "py" and bool(REDIR.search(t))

          def places(path, lines):
              # the lines of a file that read a file of the project
              kind = kind_of(path, lines)
              code = {"text": text_code, "py": py_code, "sh": sh_code, "skip": lambda lines: []}[kind](lines)
              held = set()
              for _ in range(4):
                  held |= {m.group(1) for _, l in code for rx in SET for m in rx.finditer(l) if project(m.group(2)) or BLOB.search(m.group(2)) or ROOT.search(m.group(2)) or any(re.search(r"\$\{?" + v + r"\b", m.group(2)) for v in held)}
              var = (lambda v: r"\$\{?" + v + r"\b|\b" + v + r"\b") if kind == "py" else (lambda v: r"\$\{?" + v + r"\b")
              in_text = lambda t: re.search(r"(^|[\s;(])" + WORDS + r"\s", t) and project(t)
              in_code = lambda t: reads(kind, t) and (project(t) or any(re.search(var(v), t) for v in held))
              return [(i, t) for i, t in code if BLOB.search(t) or (in_text if kind == "text" else in_code)(t)]

          def own(lines, i):
              # whether line i can carry an anchor of its own: its text, its leading blanks aside, stands in no other line of its file
              s = lines[i - 1].strip()
              return not any(s in l for j, l in enumerate(lines, 1) if j != i)

          def anchor_line(lines, i):
              # the line that carries the anchor of line i: line i, or the nearest line above it that can carry one
              while i > 1 and not own(lines, i):
                  i -= 1
              return i

          def read_file(f):
              try:
                  return open(f, encoding="utf-8").read().split("\n")
              except (OSError, UnicodeDecodeError):
                  return []

          wf = read_file(WF)
          start = [n for n, l in enumerate(wf) if l.startswith(STEP)]
          step = wf[start[0]:] if len(start) == 1 else []
          step = step[:1 + next((n for n, l in enumerate(step[1:]) if re.match(r"      - |  \S", l)), len(step))]
          red = [] if step else ["RED  %s carries the step on line endings %d times, where it must carry it once" % (WF, len(start))]
          files, anchors = {}, []
          for k, l in enumerate(step):
              a = re.match(r'\s*# reads: `([^`]+)` "(.*)"$', l)
              n = re.match(r'\s*# not a place \((.+)\): `([^`]+)` "(.*)"$', l)
              f, text = (a or n or re.match("()()", "")).groups()[-2:]
              hold = next((h for h in step[k + 1:] if not re.match(r"\s*# reads: ", h)), "")
              under = re.match(r'\s*hold "([^",\s]+)', hold)
              red += ["RED  the anchor `%s` \"%s\" stands over no hold of that file in the step on line endings: put it over the hold of the case that reads it" % (f, text)] if a and not (under and under.group(1) == f) else []
              found = [j for j, x in enumerate(files.setdefault(f, read_file(f)), 1) if text in x] if a or n else []
              ok = 20 <= len(text) <= 80 and len(found) == 1
              red += ["RED  the anchor `%s` \"%s\" in the step on line endings is not found once in that file, as 20 to 80 characters of one line: it is found on %d lines" % (f, text, len(found))] if (a or n) and not ok else []
              anchors += [(f, found[0], "case" if a else "not a place")] if (a or n) and ok else []
          found_places = []
          for d in ("hooks", "bin", "skills", "shared"):
              for dp, _, fs in sorted(os.walk(d)):
