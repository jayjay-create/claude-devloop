# The half of the merge gate that lives in this repository: on every pull
# request into main, run scripts/devloop-stock-take and its self-test against
# the merged state, and fail the check when either fails. The other half, the
# check being required on main, is a setting of the repository and not a file
# in it: docs/roadmap.md, the entry of 29 September 2026 on the merge gate,
# carries the command that sets it and the merge sequence that follows.
#
# The check appears under the job's name, stock-take. It installs nothing:
# the tool needs python3 (3.8 or later, for ast.Constant and
# subprocess.run(capture_output=True)) and git (2.15 or later, for rev-parse
# --is-shallow-repository), and the runner image carries both. It writes
# nothing back: contents are read-only and the token is not persisted.
#
# Since the fourth addendum of 14 October 2026 to the roadmap entry on the
# command reader a second job, hooks on every system, runs on ubuntu-latest,
# macos-latest and windows-latest - there under the bash of Git for Windows,
# which "shell: bash" selects - and, since the fifth addendum of that day,
# under Alpine 3.22 with busybox awk in a container on ubuntu-latest, the
# reader's self-test and every handler of hooks/hooks.json once with a
# harmless input of its event in a throwaway project, and is red where the
# self-test or a handler answers otherwise than 0: devloop runs on every
# system, the person's decision of that day, and until then nothing showed
# that the reader ran under Linux at all, where it did not. Its four checks
# carry the job's name with the system in brackets; making them required on
# main is the owner's setting, as for stock-take, and the fifth addendum
# carries the command. .gitattributes keeps every text file at LF on every
# system, Git for Windows' default core.autocrlf=true notwithstanding. Since
# the addendum of 17 October 2026 to the roadmap entry of that day on arming
# past the gate the job runs the self-test of bin/devloop-arm beside the
# reader's, and is red where it is. Since 22 October 2026 the job stock-take
# reads the title of the pull request and the head of every entry the branch
# adds to docs/roadmap.md against the rule on titles, the last step of the
# job, and the event fires with the type edited as well, so that a title
# changed on an open pull request is read before it can be merged; the three
# default types stand beside it, since naming one type names them all.
name: merge gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: stock-take-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stock-take:
    name: stock-take
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The tool blames every line of every thing, finds the commit that
          # introduced a version with git log -S over the history, holds a
          # run's commit against origin/main, and refuses a shallow clone. A
          # default checkout is one commit deep with no origin/main; depth 0
          # fetches all history for all branches. The ref stays the event's
          # default, refs/pull/N/merge: the branch merged onto main as main
          # stood when the run started, not the branch tip.
          fetch-depth: 0
          persist-credentials: false

      - name: what the checkout holds
        run: |
          git --version
          python3 --version
          echo "HEAD $(git rev-parse HEAD) with parents $(git rev-parse 'HEAD^@' | tr '\n' ' ')"
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "shallow checkout: the tool refuses it"; exit 1; }
          git rev-parse -q --verify origin/main >/dev/null || { echo "no origin/main: the tool cannot hold runs against it"; exit 1; }
          echo "origin/main $(git rev-parse origin/main)"

      - name: stock-take
        run: scripts/devloop-stock-take

      - name: self-test
        run: scripts/devloop-stock-take --self-test

      # Since 12 October 2026: every hook reads its input through
      # bin/devloop-command-reader and through nothing else, the one line
      # below standing once in each, hooks/stop-checks.sh excepted, which
      # discards its input with cat >/dev/null and reads nothing of it; every
      # handler under PreToolUse and the one under PermissionRequest in
      # hooks/hooks.json carries "onFailure": "block"; since 13 October 2026
      # no handler under PreToolUse carries an if field, since the vendor
      # calls that filter best-effort and the three guards it narrowed hold
      # hard prohibitions; and the reader's self-test is green.
      # docs/skill-conventions.md, "A hook reads its input through one
      # program". This step is no check of "Before a handover, run these"; it
      # runs here, on every pull request, and installs nothing.
      - name: hooks read through the reader, handlers block on failure and carry no if field, the reader's self-test
        run: |
          bin/devloop-command-reader --self-test
          LINE='INPUT=$("$HERE/../bin/devloop-command-reader") || exit 1'
          HERE='HERE=$(cd "$(dirname "$0")" && pwd)'
          red=0
          for f in hooks/*.sh; do
            if [ "$f" = hooks/stop-checks.sh ]; then
              [ "$(grep -cFx 'cat >/dev/null' "$f")" -eq 1 ] && ! grep -qF 'devloop-command-reader' "$f" || { echo "$f: reads its input, and it is the one hook that discards it"; red=1; }
            else
              [ "$(grep -cFx "$LINE" "$f")" -eq 1 ] && [ "$(grep -cFx "$HERE" "$f")" -eq 1 ] || { echo "$f: does not read its input through the one line"; red=1; }
            fi
            grep -nE '\$\(cat\)|<&0|/dev/stdin|cat \| |^cat$' "$f" && { echo "$f: reads its input another way"; red=1; }
          done
          python3 - <<'PY' || red=1
          import json, sys
          h = json.load(open("hooks/hooks.json"))["hooks"]
          bad = [x["command"] for ev in ("PreToolUse", "PermissionRequest") for g in h[ev] for x in g["hooks"] if x.get("onFailure") != "block"]
          if bad:
              print("handlers without onFailure block:", bad); sys.exit(1)
          filtered = [x["command"] for g in h["PreToolUse"] for x in g["hooks"] if "if" in x]
          if filtered:
              print("handlers under PreToolUse with an if field:", filtered); sys.exit(1)
          PY
          exit $red

      # Since 20 October 2026: README.md says the state of today and carries no
      # date, the history standing in the commits and in docs/roadmap.md, the
      # person's decision of that day, the roadmap entry of that date on
      # milestone 3, part 2; docs/skill-conventions.md, "README.md carries no
      # date". Red where the file carries a date in a form like 20 October
      # 2026, October 2026 or 2026-10-20, one broken over a line break
      # included: the file is read as one line, every line break and carriage
      # return a space, and every date found is printed. Before that day the
      # README carried eight such dates, one of them over a line break. This
      # step is no check of "Before a handover, run these" either. The red
      # line says since 21 October 2026 that the file must carry no date and
      # that it carries what follows.
      - name: README.md carries no date
        run: |
          DATES=$(tr '\r\n' '  ' < README.md | grep -o -E '([0-9]{1,2} +)?(January|February|March|April|May|June|July|August|September|October|November|December) +[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2}') || { echo "README.md carries no date"; exit 0; }
          echo "README.md must carry no date, and it carries:"; printf '%s\n' "$DATES"; exit 1

      # Since 21 October 2026: README.md names no file or document of devloop's
      # own, the second half of the rule under "README.md carries no date" in
      # docs/skill-conventions.md, the person's decision of that day, the
      # roadmap entry of that date on milestone 3, part 3. Red where the file
      # names one of devloop's documents - docs/plan.md, docs/roadmap.md,
      # docs/skill-conventions.md, docs/stock-take.tsv - or a path into bin/,
      # scripts/, shared/, hooks/, skills/, .github/ or .claude-plugin/, the
      # file read as one line as above and every find printed. What the README
      # says of the user's project - docs/agents/, ~/.claude/settings.json,
      # .claude/ - is no find, none of those being in the list. This step is
      # no check of "Before a handover, run these" either.
      - name: README.md names no file or document of devloop's own
        run: |
          NAMES=$(tr '\r\n' '  ' < README.md | grep -o -E 'docs/(plan\.md|roadmap\.md|skill-conventions\.md|stock-take\.tsv)|(^|[^A-Za-z0-9_./~-])(bin|scripts|shared|hooks|skills|\.github|\.claude-plugin)/[A-Za-z0-9_./-]*') || { echo "README.md names no file or document of devloop's own"; exit 0; }
          echo "README.md must name no file or document of devloop's own, and it names:"; printf '%s\n' "$NAMES" | sed 's/^[^A-Za-z0-9_.]//'; exit 1

      # Since 22 October 2026: a title says what changed and nothing else -
      # the title of a pull request, the first line of a commit message, the
      # head of a new entry in docs/roadmap.md - in at most 72 characters,
      # with no date, no version number and no "the person", written as the
      # owner's own; decided on 22 October 2026, docs/skill-conventions.md
      # under "A title says what changed". Red where the title of the pull
      # request, or the head of an entry this branch adds to docs/roadmap.md
      # - a line starting with "- **" that git diff origin/main...HEAD lists
      # as added, read from that line to the closing "**", its lines joined
      # with one space, the text between the markers measured - is longer
      # than 72 characters, or carries a date in a form like 20 October 2026,
      # October 2026 or 2026-10-20, a version number, three numbers joined by
      # dots, or the words "the person", case not mattering; every find
      # printed with the title. Old heads are not in the diff and are not
      # read. The title comes out of the event through the environment
      # variable PR_TITLE and never stands in the text of this script, so
      # that a title cannot run as shell. A commit's first line is not read
      # here: a squash merge takes the title of the pull request. This step
      # is no check of "Before a handover, run these" either.
      - name: titles say what changed, in at most 72 characters, with no date, no version and no "the person"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          MONTHS = "January|February|March|April|May|June|July|August|September|October|November|December"
          RULES = [
              ("a date", re.compile(r"\b([0-9]{1,2} +)?(%s) +[0-9]{4}\b|\b[0-9]{4}-[0-9]{2}-[0-9]{2}\b" % MONTHS)),
              ("a version number", re.compile(r"\b[0-9]+\.[0-9]+\.[0-9]+\b")),
              ('the words "the person"', re.compile(r"\bthe person\b", re.IGNORECASE)),
          ]
          red = 0
          def judge(what, text):
              global red
              faults = []
              if len(text) > 72:
                  faults.append("%d characters where 72 is the most" % len(text))
              for name, rx in RULES:
                  m = rx.search(text)
                  if m:
                      faults.append("%s, %s" % (name, m.group(0)))
              if faults:
                  red = 1
                  print("%s must say what changed and nothing else, and it carries %s: %s" % (what, "; ".join(faults), text))
              else:
                  print("%s passes: %s" % (what, text))
          judge("the title of the pull request", os.environ.get("PR_TITLE", ""))
          diff = subprocess.run(["git", "diff", "origin/main...HEAD", "--", "docs/roadmap.md"], capture_output=True, text=True, check=True).stdout
          added = {l[1:] for l in diff.splitlines() if l.startswith("+- **")}
          lines = open("docs/roadmap.md", encoding="utf-8").read().split("\n")
          n = 0
          for i, line in enumerate(lines):
              if line.startswith("- **") and line in added:
                  text = line[4:]
                  j = i
                  while "**" not in text and j + 1 < len(lines):
                      j += 1
                      text += " " + lines[j].strip()
                  n += 1
                  judge("the head of the new entry at line %d of docs/roadmap.md" % (i + 1), text.split("**", 1)[0])
          print("%d new entry heads read" % n)
          sys.exit(red)
          PY

  # Since the fourth addendum of 14 October 2026: the reader's self-test and
  # every handler of hooks/hooks.json once, on the three systems devloop runs
  # on, Windows under the bash of Git for Windows, and since the fifth
  # addendum of that day under Alpine 3.22 with busybox awk as well, the
  # fourth entry of the matrix: a container on ubuntu-latest - GitHub's docs,
  # "jobs.<job_id>.container", a job container needs a Linux runner, and an
  # empty value is no container - in which the first step installs bash, git
  # and python3, since the image carries none of them and "shell: bash" is
  # the job's default, and marks the checkout a safe directory for git,
  # since git refuses in a container a repository owned by another user
  # unless the directory is marked safe; that second half came with the
  # branch's last commit, after the fifth addendum was written, which names
  # the installation alone. The handlers are read off
  # hooks/hooks.json with python3 so that one added later under an event and
  # matcher this step has an input for runs without this step being touched;
  # one under a new pair of event and matcher needs its input added here, the
  # step ending red on it until then. The input of each event stands below,
  # harmless - the
  # command ls for the tool Bash, a Write and an Edit of the project's README
  # on a branch cut from main, a permission request for ls, a session start,
  # a stop, since 15 October 2026 the result of ls and a failed ls for
  # the handler under PostToolUse and PostToolUseFailure without a matcher,
  # which reads nothing where the input names no transcript, and since 21
  # October 2026 the same two with a tool_use_id for the handler under the
  # two events with the matcher Bash, which finds no note for that id and
  # writes nothing - in a throwaway
  # project outside the checkout with docs/agents/, a
  # commit on main pushed to a local bare origin whose HEAD is main, and the
  # work on a branch, since the branch guard blocks a Write on main by design.
  # A red self-test or a handler that answers otherwise than 0 makes the
  # check red, with what it printed; the handlers start after a red self-test
  # too, since the fifth addendum, so that one run shows every fault at once.
  # The name below keeps the three checks' names of the fourth addendum and
  # adds "hooks on every system (alpine)". Since the addendum of 17 October
  # 2026 to the roadmap entry of that day on arming past the gate the step
  # runs the self-test of bin/devloop-arm after the reader's, every case
  # answered by a stand-in for gh and none reaching GitHub, and a red case
  # makes the check red as a red case of the reader's does; the handlers
  # start after it all the same.
  hooks-on-every-system:
    name: hooks on every system (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: ubuntu-latest
            runner: ubuntu-latest
          - system: macos-latest
            runner: macos-latest
          - system: windows-latest
            runner: windows-latest
          - system: alpine
            runner: ubuntu-latest
            container: alpine:3.22
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: what the container needs, under Alpine alone
        if: matrix.system == 'alpine'
        shell: sh
        run: apk add --no-cache bash git python3 && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: what the checkout holds
        run: |
          uname -a
          { grep -m1 PRETTY_NAME /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || true; } | head -1
          bash --version | head -1
          { awk --version 2>/dev/null || awk -W version 2>/dev/null || busybox 2>/dev/null || true; } | head -1
          git version
          git config --show-origin --get core.autocrlf || echo "core.autocrlf unset"
          git ls-files --eol bin/devloop-command-reader hooks/pre-tool-use-install-guard.sh

      - name: the self-tests of the reader, of the arming program and of the question program, and every handler of hooks.json once with a harmless input of its event
        run: |
          set -u
          ROOT=$(pwd)
          red=0
          "$ROOT/bin/devloop-command-reader" --self-test || red=1
          "$ROOT/bin/devloop-arm" --self-test || red=1
          PY=$(command -v python3 || command -v python) || { echo "no python on PATH"; exit 1; }
          # the self-test of bin/devloop-auto-mode-question, since 22 October 2026, beside the arming program's: its stand-in for gh is a shell script, which a process started from Python finds on macOS and Linux and not on Windows, so it runs on the three other systems
          case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) echo "the self-test of bin/devloop-auto-mode-question is not run on Windows" ;; *) "$PY" "$ROOT/bin/devloop-auto-mode-question" --self-test || red=1 ;; esac
          T=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/devloop-hooks.XXXXXX")
          P="$T/project"
          mkdir -p "$P/docs/agents"
          git -C "$P" init -q
          git -C "$P" checkout -q -b main 2>/dev/null || true
          printf '# project\n' > "$P/README.md"
          git -C "$P" add README.md
          git -C "$P" -c user.name=hooks -c user.email=hooks@example.invalid commit -q -m init
          git init -q --bare "$T/origin.git"
          git -C "$P" remote add origin "$T/origin.git"
          git -C "$P" push -q origin main
          git -C "$P" remote set-head origin main
          git -C "$P" checkout -q -b work
          export CLAUDE_PROJECT_DIR="$P"
          PROG=$(cat <<'PYEOF'
          import json, sys
          p = sys.argv[1]
          h = json.load(open("hooks/hooks.json"))["hooks"]
          base = {"session_id": "s1", "cwd": p, "permission_mode": "default", "tool_use_id": "toolu_hooks1"}
          inputs = {
              ("PreToolUse", "Bash"): dict(base, hook_event_name="PreToolUse", tool_name="Bash", tool_input={"command": "ls", "description": "list"}),
              ("PreToolUse", "Edit|Write|MultiEdit"): dict(base, hook_event_name="PreToolUse", tool_name="Write", tool_input={"file_path": p + "/README.md", "content": "# project\n"}),
              ("PermissionRequest", ""): dict(base, hook_event_name="PermissionRequest", tool_name="Bash", tool_input={"command": "ls"}),
              ("PermissionDenied", "Bash"): dict(base, hook_event_name="PermissionDenied", permission_mode="auto", tool_name="Bash", tool_input={"command": "ls", "description": "list"}, reason="[Test]"),
              ("SessionStart", ""): dict(base, hook_event_name="SessionStart", source="startup"),
              ("PostToolUse", "Edit|Write|MultiEdit"): dict(base, hook_event_name="PostToolUse", tool_name="Edit", tool_input={"file_path": p + "/README.md", "old_string": "a", "new_string": "b"}, tool_response={"filePath": p + "/README.md"}),
              ("PostToolUse", ""): dict(base, hook_event_name="PostToolUse", tool_name="Bash", tool_input={"command": "ls", "description": "list"}, tool_response={"stdout": "", "stderr": "", "interrupted": False}),
              ("PostToolUseFailure", ""): dict(base, hook_event_name="PostToolUseFailure", tool_name="Bash", tool_input={"command": "ls", "description": "list"}, error="Exit code 1", is_interrupt=False),
              ("PostToolUse", "Bash"): dict(base, hook_event_name="PostToolUse", tool_name="Bash", tool_input={"command": "ls", "description": "list"}, tool_response={"stdout": "", "stderr": "", "interrupted": False, "isImage": False}),
              ("PostToolUseFailure", "Bash"): dict(base, hook_event_name="PostToolUseFailure", tool_name="Bash", tool_input={"command": "ls", "description": "list"}, error="Exit code 1", is_interrupt=False),
              ("Stop", ""): dict(base, hook_event_name="Stop", stop_hook_active=False),
          }
          for event, groups in h.items():
              for g in groups:
                  matcher = g.get("matcher", "")
                  inp = inputs.get((event, matcher))
                  if inp is None:
                      sys.exit("no input known for the event %s with the matcher %r: add one to this step" % (event, matcher))
                  for x in g["hooks"]:
                      print("\t".join([event, matcher or "-", x["command"], json.dumps(inp)]))
          PYEOF
          )
          LIST=$("$PY" -c "$PROG" "$P") || exit 1
          n=0
          while IFS=$'\t' read -r EVENT MATCHER CMD INPUT; do
            [ -n "$CMD" ] || continue
            HOOK="${CMD/\$\{CLAUDE_PLUGIN_ROOT\}/$ROOT}"
            OUT=$(cd "$P" && printf '%s' "$INPUT" | "$HOOK" 2>&1); RC=$?
            n=$((n + 1))
            echo "$EVENT $MATCHER $(basename "$HOOK"): exit $RC"
            [ "$RC" -eq 0 ] || { printf '%s\n' "$OUT" | sed 's/^/    /'; red=1; }
          done <<< "$LIST"
          echo "$n handlers started"
          rm -rf "$T"
          exit "$red"
