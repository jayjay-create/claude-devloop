          red += ["RED  %s:%d: an anchor at a case and one among the not places name the same line" % fa for fa in both]
          red += ["RED  %s:%d: an anchor of the step on line endings names this line, and it reads no file of the project, by this check: take the anchor out" % fa for fa in idle]
          red += ["%d lines read a file of the project, and the last step of the job hooks on every system names no case for them. Give that step a case for each, which reads with CRLF what it reads with LF, and over the case's call of hold a line # reads: `FILE` \"TEXT\", TEXT 20 to 80 characters of the line found once in the file, of the nearest line above it where its text stands in another line of the file too. Or, where the line reads no file of the project, a line # not a place (the reason): `FILE` \"TEXT\" at the head of that step." % len(missing)] if missing else []
