  hooks-on-every-system:
    name: hooks on every system (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: ubuntu-latest
            runner: ubuntu-latest
          - system: macos-latest
            runner: macos-latest
          - system: windows-latest
            runner: windows-latest
          - system: alpine
            runner: ubuntu-latest
            container: alpine:3.22
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: what the container needs, under Alpine alone
        if: matrix.system == 'alpine'
        shell: sh
        run: apk add --no-cache bash git python3 && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: what the checkout holds
        run: |
          uname -a
          { grep -m1 PRETTY_NAME /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || true; } | head -1
          bash --version | head -1
          { awk --version 2>/dev/null || awk -W version 2>/dev/null || busybox 2>/dev/null || true; } | head -1
          git version
          { command -v python3 && python3 --version; } || echo "no python3 on PATH"
          echo "pgrep: $(command -v pgrep || echo 'not on PATH')"
          git config --show-origin --get core.autocrlf || echo "core.autocrlf unset"
          git ls-files --eol bin/devloop-command-reader hooks/pre-tool-use-install-guard.sh

      - name: every self-test under bin/, every handler of hooks.json once with a harmless input of its event, the install guard under PermissionDenied with a counted refusal, whose record must stand afterwards, the guard on the mark blocking a write of the mark in auto mode, GitHub answered by a stand-in, the guard on the PowerShell tool turning a call down where docs/agents/ stands and letting it through where none stands, and each of the four hooks that hand a command over on the path on which it hands over, without CLAUDE_CODE_ENTRYPOINT and with it on cli, and bin/devloop-text skill-name carrying the line of bin/devloop-surface in the rule on the two forms, without CLAUDE_CODE_ENTRYPOINT and with it on cli
        run: |
          set -u
          # every exit code the step reads stands behind ||, RC=0; OUT=$(...) || RC=$?, since 25 October 2026: GitHub runs the step as bash --noprofile --norc -eo pipefail {0}, the command of shell: bash in the workflow syntax under jobs.<job_id>.steps[*].shell, and under -e OUT=$(...); RC=$? ends it at any exit but 0 before RC is set, as it ended the step on pull request #205 at the 2 of the guard on the mark
          ROOT=$(pwd)
          red=0
          PY=$(command -v python3 || command -v python) || { echo "no python on PATH"; exit 1; }
          # every self-test under bin/, since 23 October 2026: each file there that takes --self-test, a python program run with the interpreter found above, any other by its own first line; until that day the reader's, the arming program's and, since 22 October 2026, the question program's alone
          # on all four systems since 10 November 2026; from the addendum of 23 October 2026 until then the self-tests of bin/devloop-bounded and bin/devloop-setup-state were left out under Windows, a line for each saying so and why
          for f in "$ROOT"/bin/*; do
            grep -q -e '--self-test' "$f" || continue
            echo "== $(basename "$f") --self-test"
