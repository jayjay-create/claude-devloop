# The half of the merge gate that lives in this repository: on every pull
# request into main, run scripts/devloop-stock-take and its self-test against
# the merged state, and fail the check when either fails. The other half, the
# check being required on main, is a setting of the repository and not a file
# in it: docs/roadmap.md, the entry of 29 September 2026 on the merge gate,
# carries the command that sets it and the merge sequence that follows.
#
# The check appears under the job's name, stock-take. It installs nothing:
# the tool needs python3 (3.8 or later, for ast.Constant and
# subprocess.run(capture_output=True)) and git (2.15 or later, for rev-parse
# --is-shallow-repository), and the runner image carries both. It writes
# nothing back: contents are read-only and the token is not persisted.
name: merge gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stock-take-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stock-take:
    name: stock-take
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The tool blames every line of every thing, finds the commit that
          # introduced a version with git log -S over the history, holds a
          # run's commit against origin/main, and refuses a shallow clone. A
          # default checkout is one commit deep with no origin/main; depth 0
          # fetches all history for all branches. The ref stays the event's
          # default, refs/pull/N/merge: the branch merged onto main as main
          # stood when the run started, not the branch tip.
          fetch-depth: 0
          persist-credentials: false

      - name: what the checkout holds
        run: |
          git --version
          python3 --version
          echo "HEAD $(git rev-parse HEAD) with parents $(git rev-parse 'HEAD^@' | tr '\n' ' ')"
          [ "$(git rev-parse --is-shallow-repository)" = false ] || { echo "shallow checkout: the tool refuses it"; exit 1; }
          git rev-parse -q --verify origin/main >/dev/null || { echo "no origin/main: the tool cannot hold runs against it"; exit 1; }
          echo "origin/main $(git rev-parse origin/main)"

      - name: stock-take
        run: scripts/devloop-stock-take

      - name: self-test
        run: scripts/devloop-stock-take --self-test

      # Since 12 October 2026: every hook reads its input through
      # bin/devloop-command-reader and through nothing else, the one line
      # below standing once in each, hooks/stop-checks.sh excepted, which
      # discards its input with cat >/dev/null and reads nothing of it; every
      # handler under PreToolUse and the one under PermissionRequest in
      # hooks/hooks.json carries "onFailure": "block"; since 13 October 2026
      # no handler under PreToolUse carries an if field, since the vendor
      # calls that filter best-effort and the three guards it narrowed hold
      # hard prohibitions; and the reader's self-test is green.
      # docs/skill-conventions.md, "A hook reads its input through one
      # program". This step is no check of "Before a handover, run these"; it
      # runs here, on every pull request, and installs nothing.
      - name: hooks read through the reader, handlers block on failure and carry no if field, the reader's self-test
        run: |
          bin/devloop-command-reader --self-test
          LINE='INPUT=$("$HERE/../bin/devloop-command-reader") || exit 1'
          HERE='HERE=$(cd "$(dirname "$0")" && pwd)'
          red=0
          for f in hooks/*.sh; do
            if [ "$f" = hooks/stop-checks.sh ]; then
              [ "$(grep -cFx 'cat >/dev/null' "$f")" -eq 1 ] && ! grep -qF 'devloop-command-reader' "$f" || { echo "$f: reads its input, and it is the one hook that discards it"; red=1; }
            else
              [ "$(grep -cFx "$LINE" "$f")" -eq 1 ] && [ "$(grep -cFx "$HERE" "$f")" -eq 1 ] || { echo "$f: does not read its input through the one line"; red=1; }
            fi
            grep -nE '\$\(cat\)|<&0|/dev/stdin|cat \| |^cat$' "$f" && { echo "$f: reads its input another way"; red=1; }
          done
          python3 - <<'PY' || red=1
          import json, sys
          h = json.load(open("hooks/hooks.json"))["hooks"]
          bad = [x["command"] for ev in ("PreToolUse", "PermissionRequest") for g in h[ev] for x in g["hooks"] if x.get("onFailure") != "block"]
          if bad:
              print("handlers without onFailure block:", bad); sys.exit(1)
          filtered = [x["command"] for g in h["PreToolUse"] for x in g["hooks"] if "if" in x]
          if filtered:
              print("handlers under PreToolUse with an if field:", filtered); sys.exit(1)
          PY
          exit $red
