              at.setdefault((f, j), set()).add(what)
          missing = [(f, i) for f, i, a in found_places if (f, a) not in at]
          both = sorted({(f, a) for f, i, a in found_places if len(at.get((f, a), ())) == 2})
          idle = sorted(set(at) - {(f, a) for f, i, a in found_places})
